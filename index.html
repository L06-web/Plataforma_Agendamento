<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat e Agendamento</title>
  <link rel="stylesheet" href="estilo.css"/> 
</head>
<body>
  <div class="container">
    <!-- Seção de Agendamento -->
    <div class="agendamento">
      <h2>Agendamento</h2>
      <form id="formAgendamento" onsubmit="return agendar()">
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" required />
        </div>
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="data">Data:</label>
          <input type="date" id="data" required />
        </div>
        <div class="form-group">
          <label for="hora">Hora:</label>
          <input type="time" id="hora" required />
        </div>
        <div class="form-group">
          <label for="servico">Serviço:</label>
          <select id="servico" required>
            <option value="">Selecione...</option>
            <option>Corte</option>
            <option>Barba</option>
            <option>Sobrancelha</option>
            <option>Depilação nazal</option>
            <option>Corte e Barba</option>
            <option>Corte e serviço (Sobrancelha ou Depilação nazal)</option>
            <option>Completo</option>
          </select>
        </div>
        <div class="form-group">
          <label for="observacao">Observação:</label>
          <input type="text" id="observacao" placeholder="Ex: Cliente prefere horário pontual" />
        </div>
        <button type="submit">Agendar</button>
      </form>
      <div id="confirmacao"></div>
    </div>

    <!-- Seção de Consulta -->
    <div class="consulta">
      <h3>Consultar Agendamento</h3>
      <input type="text" id="nomeConsulta" placeholder="Digite o nome para consultar" />
      <button onclick="consultarAgendamentos()">Consultar</button>
      <div id="resultadoConsulta"></div>
    </div>
    </div>

  <script src="script.js"></script>
</body>
</html>
